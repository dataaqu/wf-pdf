# Railway / Nixpacks build config
#
# PDF generation uses @sparticuz/chromium at runtime — a self-contained Chromium
# that bundles all its own shared libraries. So we need NO system Chromium
# (Ubuntu's apt `chromium` is a broken snap wrapper that fails in containers).

[phases.setup]
# Latin font fallbacks; the app also embeds its own fonts as base64.
aptPkgs = ["fonts-liberation"]

[variables]
# Skip Puppeteer's ~150MB bundled Chromium download — unused in production.
PUPPETEER_SKIP_DOWNLOAD = "true"

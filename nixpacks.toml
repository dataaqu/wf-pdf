# Railway / Nixpacks build config
# Installs a system Chromium (with all shared libraries) for Puppeteer,
# so it does not rely on the bundled Chromium that lacks runtime deps.

[phases.setup]
# Installing `chromium` pulls in all its shared-library dependencies
# automatically (libnss3, libgbm1, libasound2t64, ...), so we don't list them
# explicitly — package names differ across Ubuntu releases (e.g. Noble renamed
# libasound2 -> libasound2t64). fonts-liberation covers Latin fallbacks;
# app fonts are embedded as base64.
aptPkgs = ["chromium", "fonts-liberation"]

[variables]
# Point Puppeteer at the apt-installed Chromium instead of its bundled one...
PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium"
# ...and skip the ~150MB Chromium download during `npm install` (we don't use it).
PUPPETEER_SKIP_DOWNLOAD = "true"
